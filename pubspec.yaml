name: muhallah
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0' # Updated the SDK range for modern Flutter

dependencies:
  flutter:
    sdk: flutter

  # --- START: Updated/Required Dependencies ---
  cupertino_icons: ^1.0.8
  file_picker: ^10.3.7
  url_launcher: ^6.3.2
  image_picker: ^1.0.7
  http: ^1.2.0
  
  # Recommended modern stable versions for Firebase
  firebase_core: ^3.6.0     # For Firebase initialization
  firebase_auth: ^5.3.1     # For user registration and login
  cloud_firestore: ^5.4.4   # For storing user details (Name, CNIC, etc.)
  firebase_messaging: ^15.1.0 # For push notifications
  firebase_storage: ^12.3.0  # Updated version (if you need image storage later)
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^13.0.0
  email_otp: 2.1.0
  mailer: ^6.1.0
  cloudinary_public: ^0.23.1
  intl: ^0.20.2
  provider: ^6.1.2
  uuid: ^4.4.0
  # --- Bill Reminder: new packages ---
  get: ^4.6.6                        # GetX state management
  hive: ^2.2.3                       # Local database
  hive_flutter: ^1.1.0               # Hive Flutter init helper
  flutter_local_notifications: ^17.2.3  # Push notifications
  timezone: ^0.9.4                   # Timezone-aware scheduling
  google_mlkit_text_recognition: ^0.15.0
  google_mlkit_commons: ^0.11.0
  image: ^4.0.0
  path_provider: ^2.0.0
  share_plus: ^12.0.2
  adhan: ^2.0.0+1
  google_maps_flutter: ^2.11.0
  geocoding: ^3.0.0
  flutter_qiblah: ^3.1.0+1
  just_audio: ^0.10.5
  permission_handler: ^12.0.1
  shared_preferences: ^2.3.2
  video_player: ^2.9.0
  timeago: ^3.7.1
  # --- END: Updated/Required Dependencies ---

dependency_overrides:
  # Pin to 2.14.8 to avoid Kotlin 2.x K2 compiler crash in newer google_maps_flutter_android versions (2.19.x)
  google_maps_flutter_android: 2.14.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  hive_generator: ^2.0.0
  build_runner: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/