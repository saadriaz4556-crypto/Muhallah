name: muhallah
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0' # Updated the SDK range for modern Flutter

dependencies:
  flutter:
    sdk: flutter

  # --- START: Updated/Required Dependencies ---
  cupertino_icons: ^1.0.8
  file_picker: ^10.3.7
  url_launcher: ^6.3.2
  image_picker: ^1.0.7
  http: ^1.2.0
  
  # Recommended modern stable versions for Firebase
  firebase_core: ^3.6.0     # For Firebase initialization
  firebase_auth: ^5.3.1     # For user registration and login
  cloud_firestore: ^5.4.4   # For storing user details (Name, CNIC, etc.)
  firebase_storage: ^12.3.0  # Updated version (if you need image storage later)
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^13.0.0
  email_otp: 2.1.0
  mailer: ^6.1.0
  cloudinary_public: ^0.23.1
  intl: ^0.20.2
  # --- END: Updated/Required Dependencies ---

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0 # Updated lint package version

flutter:
  uses-material-design: true
  assets:
    - assets/images/